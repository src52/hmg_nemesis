name: Build NEMESIS packages

on:
  pull_request:
    paths:
      - "Sources/packages/**"
      - "Sources/tools/make_nemesis_package.py"
      - ".github/workflows/build-packages.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package ZIPs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and validate packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p Sources/out
          packages=(Sources/packages/*)
          if (( ${#packages[@]} == 0 )); then
            echo "No package source directories found" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            [[ -d "$package" ]] || continue
            [[ -f "$package/NEMESIS.data" ]] || {
              echo "Missing NEMESIS.data: $package" >&2
              exit 1
            }

            id=$(sed -n 's/^id=//p' "$package/NEMESIS.data" | head -n 1)
            [[ "$id" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "Invalid or missing package id: $package" >&2
              exit 1
            }

            output="Sources/out/$id.zip"
            python3 Sources/tools/make_nemesis_package.py "$package" -o "$output"
            unzip -tq "$output"

            while IFS= read -r script; do
              bash -n "$script"
            done < <(find "$package" -type f -name '*.sh' -print)
          done

      - name: Upload package ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-packages-${{ github.sha }}
          path: Sources/out/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package ZIPs
        uses: actions/download-artifact@v4
        with:
          name: nemesis-packages-${{ github.sha }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists and cannot be modified after publishing." >&2
            echo "Delete the empty release or use a new tag, then rerun this workflow." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --verify-tag \
            --generate-notes \
            --title "NEMESIS $GITHUB_REF_NAME"
